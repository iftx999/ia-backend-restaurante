# Testes rodam contra H2 em memoria (modo de compatibilidade PostgreSQL),
# para nao exigir um Postgres no ambiente de CI/dev.
# Testes que dependam de comportamento especifico do Postgres devem usar
# Testcontainers quando chegarmos la (Fase 2).
spring:
  datasource:
    url: jdbc:h2:mem:restoria;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

restoria:
  ai:
    api-key: test-key
  security:
    jwt-secret: chave-de-teste-fixa-com-32-caracteres-ou-mais-1234
