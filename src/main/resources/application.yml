spring:
  application:
    name: restoria

  # Virtual threads (Java 21) no Tomcat e nos executores do Spring: cada
  # requisicao que espera a IA (dezenas de segundos) deixa de ocupar uma das
  # 200 threads de plataforma do pool padrao.
  threads:
    virtual:
      enabled: true

  # Da tempo para respostas em andamento (streams da IA) terminarem num redeploy.
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/restoria}
    username: ${DB_USERNAME:restoria}
    password: ${DB_PASSWORD:restoria}
    driver-class-name: org.postgresql.Driver
    # Nenhuma transacao segura conexao durante chamada de IA, entao o pool so
    # precisa cobrir consultas curtas. Ajuste pelo limite de conexoes do plano
    # do Postgres (somando todas as instancias).
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 10000

  jpa:
    hibernate:
      # Schema versionado via Flyway (src/main/resources/db/migration) a
      # partir daqui; Hibernate so valida que as entidades batem com o
      # schema aplicado, nunca altera o banco.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
          # INSERTs do upload de planilha em lotes (ItemVenda/ItemEstoque usam SEQUENCE).
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    # V1 e o schema que o ddl-auto:update ja tinha criado nos ambientes
    # existentes (dev local, e qualquer deploy anterior a essa migracao).
    # baseline-on-migrate marca um banco ja populado como estando na V1 sem
    # tentar recriar as tabelas; um banco novo/vazio roda a V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      # Upload de planilhas de vendas/estoque (RF-07 / RF-08, Fase 2)
      max-file-size: 10MB
      max-request-size: 10MB

  # SMTP para verificacao de e-mail no cadastro. So importa quando
  # restoria.email.mock=false (ver bloco restoria.email abaixo) — sem
  # MAIL_HOST configurado, o MockEmailSender e usado e essas propriedades
  # nem chegam a ser usadas.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

# Integracao com a API da Anthropic. A chave NUNCA vai versionada:
# sempre via variavel de ambiente ANTHROPIC_API_KEY (ver CLAUDE.md).
restoria:
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: https://api.anthropic.com
    model: claude-sonnet-5
    max-tokens: 2048
    timeout-seconds: 30
    # Maximo de chamadas simultaneas a Anthropic por instancia (bulkhead).
    # Acima disso a requisicao espera ate 20s por vaga e depois recebe 503.
    # Dimensione pelo limite de requisicoes do seu tier na Anthropic.
    max-concorrencia: ${AI_MAX_CONCORRENCIA:64}

  # GPT como alternativa ao Claude no chat consultivo (RF-22), escolha manual
  # do usuario — ver docs/05-multi-provedor-ia.md. Mock controlado pela mesma
  # flag restoria.ai.mock (nao ha restoria.openai.mock separado). O mesmo
  # bloco tambem serve pra geracao de imagem de prato (docs/06), sub-bloco
  # "imagens" abaixo.
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com
    model: gpt-5.6-terra
    max-tokens: 2048
    timeout-seconds: 30
    web-search-max-uses: 3
    max-concorrencia: ${OPENAI_MAX_CONCORRENCIA:64}
    imagens:
      modelo-geracao: gpt-image-2.5-flare
      modelo-edicao: gpt-image-2.5-sunburst
      timeout-seconds: 60
      max-concorrencia: ${OPENAI_IMAGENS_MAX_CONCORRENCIA:16}

  # Geracao/edicao de imagem de prato (RF, plano PRO — docs/06-geracao-imagem-ia.md).
  # Disco local so quando restoria.storage.s3.bucket estiver vazio (dev).
  imagem:
    storage-dir: ${IMAGEM_STORAGE_DIR:uploads/imagens-prato}

  # Object storage S3-compativel (AWS S3, Cloudflare R2, MinIO) para as imagens.
  # Obrigatorio em producao: o disco do container no Railway e apagado a cada
  # redeploy. Credenciais NUNCA versionadas: sempre via variavel de ambiente.
  storage:
    s3:
      bucket: ${S3_BUCKET:}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:auto}
      access-key-id: ${S3_ACCESS_KEY_ID:}
      secret-access-key: ${S3_SECRET_ACCESS_KEY:}

  # Integracao com a API de embeddings da Voyage AI (base de conhecimento / RAG).
  # A chave NUNCA vai versionada: sempre via variavel de ambiente VOYAGE_API_KEY.
  embeddings:
    api-key: ${VOYAGE_API_KEY:}
    base-url: https://api.voyageai.com
    model: voyage-3.5
    output-dimension: 1024
    timeout-seconds: 30

  # Autenticacao JWT (RF-05). O secret NUNCA vai versionado: sempre via
  # variavel de ambiente JWT_SECRET (minimo 32 caracteres / 256 bits, HS256).
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-expiracao-minutos: 480

  # Cobranca (SaaS): checkout + webhook do Stripe. As chaves NUNCA vao
  # versionadas: sempre via STRIPE_API_KEY / STRIPE_WEBHOOK_SECRET / STRIPE_PRICE_ID_PRO.
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    price-id-pro: ${STRIPE_PRICE_ID_PRO:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/planos?checkout=sucesso}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/planos?checkout=cancelado}

  # Verificacao de e-mail no cadastro (docs/04-roadmap.md, "Ideias futuras").
  # mock=true por padrao ate MAIL_HOST/MAIL_USERNAME/MAIL_PASSWORD serem
  # configurados de verdade — nao bloqueia o cadastro, so loga o link
  # (ver MockEmailSender). Setar EMAIL_MOCK=false em producao quando o SMTP
  # estiver configurado.
  email:
    mock: ${EMAIL_MOCK:true}
    remetente: ${EMAIL_REMETENTE:no-reply@restoria.app}
    link-base: ${FRONTEND_URL:http://localhost:4200}

# Metricas (pool do Hikari, latencia HTTP, JVM) numa porta separada que nao e
# publicada na internet: coletar pela rede privada em :9090/actuator/prometheus.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus

# DEBUG em producao gera I/O a cada requisicao; use LOG_LEVEL=DEBUG so em dev.
logging:
  level:
    com.restoria: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: INFO
